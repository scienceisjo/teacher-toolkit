<script>
/* 우리 반 과학 시간 입구 — 설정 담기·풀기 (make.html · index.html 공용)
   설정은 서버 없이 주소 뒤 #c=… 에 압축해 담는다. 내려받은 HTML 에는 window.ENTRANCE_CONFIG 로 박힌다. */
(function(){
'use strict';
const b64u = {
  enc: bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec: str => { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
};
async function pipe(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';

window.EntranceCfg = {
  /* 기본값 — 켜고 끄고, 이름·주소만 바꿔 쓰면 된다 */
  defaults: () => ({
    v:1,
    kick:'OUR SCIENCE CLASS · 2026',
    t1:'우리 반과 선생님이',
    t2:'함께하는 과학 시간',
    sub:'○○중학교 2학년 과학',
    rooms:[
      { id:'sheet', on:true,  type:'list', ic:'📄', name:'학습지',      sub:'차시별 학습지·개념 정리·문제지', items:[] },
      { id:'eval',  on:true,  type:'eval', ic:'📅', name:'평가 일정',   sub:'수행평가·지필 범위·준비물', items:[] },
      { id:'less',  on:true,  type:'list', ic:'📚', name:'수업 페이지', sub:'단원별 수업 자료와 가상 실험실', items:[] },
      { id:'tree',  on:false, type:'link', ic:'🌳', name:'질문나무',    sub:'궁금한 것을 질문으로 키우기', url:'' },
      { id:'stamp', on:false, type:'link', ic:'🏅', name:'칭찬 도장판', sub:'내 도장 확인하고 교환소 가기', url:'' },
      { id:'map',   on:true,  type:'link', ic:'🗺️', name:'과학 지도',   sub:'지금 배우는 게 어디서 와서 어디로', url:'https://scienceisjo.github.io/teacher-toolkit/science-curriculum-map/' }
    ]
  }),
  async pack(cfg){
    const raw = new TextEncoder().encode(JSON.stringify(cfg));
    if(canZip){ try { return 'c=' + b64u.enc(await pipe(raw, new CompressionStream('deflate-raw'))); } catch(e){} }
    return 'j=' + b64u.enc(raw);
  },
  async unpack(hash){
    const m = /[#&](c|j)=([A-Za-z0-9_-]+)/.exec(hash || ''); if(!m) return null;
    let bytes = b64u.dec(m[2]);
    if(m[1] === 'c'){ if(!canZip) throw new Error('이 브라우저는 압축된 설정을 풀지 못해요. 크롬·웨일·엣지 최신판으로 열어 주세요.'); bytes = await pipe(bytes, new DecompressionStream('deflate-raw')); }
    return JSON.parse(new TextDecoder().decode(bytes));
  },
  /* 빠진 칸은 기본값으로 채워 둔다 (옛 링크도 열리게) */
  fix(c){
    const d = this.defaults(); c = Object.assign({}, d, c || {});
    if(!Array.isArray(c.rooms)) c.rooms = d.rooms;
    c.rooms = c.rooms.filter(r => r && r.id).map(r => Object.assign({ on:true, type:'link', ic:'🔗', name:'새 방', sub:'', url:'', items:[] }, r));
    return c;
  },
  safeUrl: u => { u = String(u || '').trim(); return /^(https?:)?\/\//i.test(u) || /^\.{0,2}\//.test(u) ? u : (u && /^[\w.-]+\.[a-z]{2,}/i.test(u) ? 'https://' + u : ''); }
};
})();

<script>
/* 수업 도구 숲 — 캔버스 숲 엔진 (2026-09-26)
   Forest({ box, canvas, lays, mode:'hero'|'full', trees, hubs, tour, onTree, track, onFrame })
   · hero : 한 화면짜리. 하늘·나무·땅 밑 뿌리 띠까지, 스크롤 연출 없음 (학생 입구 첫 화면)
   · full : track(긴 스크롤 상자) 진행도에 따라 카메라가 땅속으로 내려간다 + 질문 따라가기
   나무 def: { id, f(가로 위치 0~1), s(크기), name, sub, url | go, hue:[색상, 채도] }
   뿌리마디 def: { id, f, d(땅속 깊이 0~1), name, sub, links:[나무 id…] } */
(function(){
'use strict';
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function grow(r, len, w, depth, max){
  const n = { len, w, ang:0, kids:[], leaves:null, ph:r() * 6.28 };
  if(depth >= max - 2){ n.leaves = []; const k = depth >= max ? 9 + (r() * 6 | 0) : 4;
    for(let i = 0; i < k; i++){ const a = r() * 6.28, d = Math.sqrt(r()) * len * (depth >= max ? 1.5 : 1.1); n.leaves.push([Math.cos(a) * d, Math.sin(a) * d * .85, (.35 + r() * .6), r()]); }
    if(depth >= max) return n; }
  const kids = depth < 1 ? 3 : (r() < .32 ? 3 : 2);
  for(let i = 0; i < kids; i++){
    const spread = depth < 1 ? .5 : .42, c = grow(r, len * (.7 + r() * .12), w * .66, depth + 1, max);
    c.ang = (kids === 3 ? (i - 1) * spread : (i ? 1 : -1) * spread * .75) + (r() - .5) * .35;
    n.kids.push(c);
  }
  return n;
}
/* 역광 — 속은 어둡고, 해 쪽 가장자리만 따뜻하게 */
const palette = ([h, s]) => [`hsl(${h} ${s * .7}% 7%)`, `hsl(${h} ${s * .8}% 11%)`, `hsl(${h - 8} ${s}% 16%)`, `hsl(${h - 30} ${s + 6}% 26%)`, `hsl(${h - 80} 62% 58%)`];

function curvePts(ax, ay, bx, by, r, bend, W, H){
  const pts = [], mx = (ax + bx) / 2 + (r() - .5) * W * .08, my = (ay + by) / 2 + (r() - .2) * H * .08;
  for(let i = 0; i <= 90; i++){ const k = i / 90, u = 1 - k;
    const x = u * u * u * ax + 3 * u * u * k * ax + 3 * u * k * k * (mx + bend) + k * k * k * bx;
    const y = u * u * u * ay + 3 * u * u * k * (ay + (by - ay) * .55) + 3 * u * k * k * my + k * k * k * by;
    pts.push([x + Math.sin(k * 19 + ax) * 3.2, y + Math.cos(k * 13 + by) * 2.4]); }
  return pts;
}

window.Forest = function(o){

  }
  function paintFar(){

    const r = rng(77);

      const n = Math.round(W / (26 * sc));

        g.beginPath(); for(let q = 0; q < 5; q++){ const ox = (r() - .5) * hh * .7, oy = -hh * (.35 + r() * .5), rr = hh * (.22 + r() * .2); g.moveTo(x + ox + rr, yb + oy); g.arc(x + ox, yb + oy, rr, 0, 6.283); }
        g.rect(x - hh * .5, yb - hh * .4, hh, hh * .4 + 6); g.fill(); }
      g.filter = 'none'; g.globalAlpha = 1;
      const fog = g.createLinearGradient(0, base - 40, 0, base + 60);
      fog.addColorStop(0, 'rgba(220,190,150,0)'); fog.addColorStop(.6, `rgba(220,190,150,${.16 - L * .04})`); fog.addColorStop(1, 'rgba(220,190,150,0)');
      g.fillStyle = fog; g.fillRect(0, base - 40, W, 100);
    });

    g.fillStyle = gr; g.beginPath(); g.moveTo(0, GY + 40);
    for(let x = 0; x <= W; x += 3) g.lineTo(x, GY - 6 - Math.abs(Math.sin(x * .9)) * 5 - Math.sin(x * .01) * 4);

  }
  function paintUnder(){
    const UH = WH - GY, c = document.createElement('canvas'); c.width = W * DPR; c.height = UH * DPR;
    const g = c.getContext('2d'); g.scale(DPR, DPR);
    const soil = g.createLinearGradient(0, 0, 0, UH);
    soil.addColorStop(0, '#171109'); soil.addColorStop(.08, '#120d08'); soil.addColorStop(1, '#050403');
    g.fillStyle = soil; g.fillRect(0, 0, W, UH);
    const r = rng(4242);

  }
  function mkGlow(){ const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32); rg.addColorStop(0, 'rgba(255,244,210,1)'); rg.addColorStop(.25, 'rgba(255,214,140,.55)'); rg.addColorStop(1, 'rgba(255,190,110,0)');

  function mkLabels(){
    const L = o.lays; L.innerHTML = '';

    if(full) hubs.forEach((h, i) => { const d = document.createElement('div');
      d.className = 'fz-lab hub';
      d.innerHTML = '<i></i><span class="no">ROOT ' + String.fromCharCode(65 + i) + '</span><b>' + h.name + '</b><small>' + h.sub + '</small>';
      L.appendChild(d); h.el = d; });
  }

  function build(){
    DPR = Math.min(devicePixelRatio || 1, 2); W = o.box.clientWidth; H = o.box.clientHeight;

    hubs = (o.hubs || []).map(h => Object.assign({}, h, { x:h.f * W, y:full ? GY + (WH - GY) * h.d : GY + (WH - GY) * (.55 + h.d * .35), lit:0 }));

    if(tour) tour.lit.forEach(l => { ctx.globalAlpha = .9; ctx.strokeStyle = 'rgba(255,230,170,.9)'; ctx.lineWidth = 2.4; ctx.beginPath();
      l.pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1] - camY) : ctx.moveTo(q[0], q[1] - camY)); ctx.stroke(); });
    hubs.forEach((h, i) => { const pulse = reduce ? .7 : .55 + Math.sin(now * .0016 + i * 2) * .25, y = h.y - camY, s = (full ? 150 : 90) * (h.lit ? 1.6 : 1);
      ctx.globalAlpha = pulse; ctx.drawImage(spr, h.x - s / 2, y - s / 2, s, s); ctx.globalAlpha = 1; ctx.drawImage(spr, h.x - 18, y - 18, 36, 36); });

    if(full) hubs.forEach(h => { ctx.strokeStyle = 'rgba(255,226,170,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(h.x, h.y - camY, 26 + (h.lit ? 6 : 0), 0, 6.283); ctx.stroke(); });
    trees.forEach(t => { t.litT = lerp(t.litT, t.lit ? 1 : 0, .12); if(t.y - camY > -50 && t.y - t.h * 1.6 - camY < H) drawTree(t, now, camY); });

    /* 좁은 화면: 이름표를 두 줄 기준선에 맞춰 엇갈리게 (나무 높이가 달라도 줄이 섞이지 않게) */
    const minTop = Math.min(...trees.map(t => t.top || t.y - t.h * 1.2));

      t.el.style.transform = `translate(${clamp(t.x, 52, W - 52)}px,${y}px) translate(-50%,-100%)`;

      h.el.classList.toggle('on', y > 0 && y < H - (full ? 250 : 40)); });

  /* 캔버스에서도 나무를 누를 수 있게 */

})();

  }).join('') || '<p class="empty">켜 둔 방이 없어요.</p>';
  document.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => openRoom(b.dataset.room)));
  drawForest(on);
}

/* 나무: 켠 방 순서대로, 가운데가 낮은 V자 — 제목 아래 공간을 비워 둔다 */
function drawForest(on){
  if(forest){ forest.destroy(); }
  const n = Math.min(on.length, 8), list = on.slice(0, n);
  const trees = list.map((r, i) => {
    const f = n === 1 ? .5 : .09 + i * (.83 / (n - 1)), mid = Math.abs(f - .5) * 2;
    return { id:r.id, f, s:.7 + mid * .34, name:r.name, sub:r.sub, hue:HUES[i % HUES.length],
      url:roomHref(r) || undefined, go:r.type !== 'link' ? r.id : undefined };
  });
  const ids = trees.map(t => t.id), pick = k => ids.filter((_, i) => i % 3 === k);
  const hubs = [{ id:'h1', f:.26, d:.1, links:pick(0).concat(pick(1)) }, { id:'h2', f:.7, d:.5, links:pick(1).concat(pick(2)) }, { id:'h3', f:.47, d:.9, links:pick(2).concat(pick(0)) }]
    .filter(h => h.links.length);
  $('#fzLays').innerHTML = '';
  forest = Forest({ box:$('#fzHero'), canvas:$('#fzCv'), lays:$('#fzLays'), mode:'hero', trees, hubs,
    onTree:t => { if(t.go) openRoom(t.go); } });
}

function dday(ds){
  const d = new Date(ds + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
  if(isNaN(d)) return null; return Math.round((d - t) / 864e5);
}
function openRoom(id){
  const r = CFG.rooms.find(x => x.id === id); if(!r) return;
  $('#vT').textContent = r.ic + ' ' + r.name; $('#vS').textContent = r.sub || '';
  const items = (r.items || []).filter(x => x && (x.t || x.u));
  let h = '';
  if(r.type === 'eval'){
    const rows = items.slice().sort((a, b) => String(a.d || '9').localeCompare(String(b.d || '9')));
    h = rows.map(x => { const k = x.d ? dday(x.d) : null;
      const tag = k == null ? '<span class="dday past">날짜 미정</span>' : k < 0 ? '<span class="dday past">끝남</span>' : '<span class="dday' + (k <= 7 ? ' near' : '') + '">' + (k === 0 ? 'D-DAY' : 'D-' + k) + '</span>';
      return '<div class="item">' + tag + '<span><b>' + esc(x.t) + '</b>' + (x.d ? ' <small>(' + esc(x.d.slice(5).replace('-', '/')) + ')</small>' : '')
        + (x.what ? '<span class="note">범위 · ' + esc(x.what) + '</span>' : '') + (x.prep ? '<span class="note">준비물 · ' + esc(x.prep) + '</span>' : '') + '</span></div>'; }).join('');
  } else {
    h = items.map((x, i) => { const u = EntranceCfg.safeUrl(x.u);
      const inner = '<span class="n">' + (i + 1) + '</span><span><b>' + esc(x.t || '제목 없음') + '</b>' + (x.note ? '<span class="note">' + esc(x.note) + '</span>' : (u ? '' : '<span class="note">준비 중</span>')) + '</span>';
      return u ? '<a class="item" href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="item off">' + inner + '</div>'; }).join('');
  }
  $('#vItems').innerHTML = h || '<p class="empty">아직 올라온 것이 없어요.</p>';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-room'));
  history.replaceState(null, '', location.pathname + location.search + (location.hash.replace(/&?room=[^&]*/, '') || '#') + '&room=' + id);
  scrollTo({ top:0, behavior:'smooth' });
}
function goHome(){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-home'));
  history.replaceState(null, '', location.pathname + location.search + location.hash.replace(/&?room=[^&]*/, ''));
}
$('#back').addEventListener('click', goHome);
/* make.html 미리보기: 부모 창이 설정을 보내면 그대로 다시 그린다 */
addEventListener('message', e => { const d = e.data; if(!d || d.type !== 'entrance-cfg') return;
  CFG = EntranceCfg.fix(d.cfg); $('#demo').hidden = true; renderHome();
  if(d.room) openRoom(d.room); else goHome(); });

(async function start(){
  let c = window.ENTRANCE_CONFIG || null, demo = false;
  if(!c){ try { c = await EntranceCfg.unpack(location.hash); } catch(e){ alert(e.message); } }
  if(!c){ demo = true; c = EntranceCfg.defaults();
    c.t1 = '해누리와 선생님이'; c.sub = '예시 화면 — 제목·방은 선생님이 바꿀 수 있어요';
    c.rooms[0].items = [{ t:'1차시 학습지', u:'', note:'주소를 넣으면 눌러서 열려요' }];
    c.rooms[1].items = [{ t:'수행평가 ① 실험 보고서', d:new Date(Date.now() + 5 * 864e5).toISOString().slice(0, 10), what:'옴의 법칙', prep:'필기구·계산기' }]; }
  CFG = EntranceCfg.fix(c);
  $('#demo').hidden = !demo;
  renderHome();
  const rm = /[#&]room=([\w-]+)/.exec(location.hash); if(rm) openRoom(rm[1]);
  const pk = window.ENTRANCE_CONFIG ? null : await EntranceCfg.pack(CFG);
  $('#editLink').href = 'make.html' + (demo || !pk ? '' : '#' + pk);
  if(window.ENTRANCE_CONFIG) $('#editLink').hidden = true;
})();
</script>
